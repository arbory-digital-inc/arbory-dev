name: Unpublish from StreamX

on:
  repository_dispatch:
    types:
      - resource-unpublished

jobs:
  check-event-status:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo $CLIENT_PAYLOAD
          echo "Status: ${{ github.event.client_payload.status }}"
          echo "Path: ${{ github.event.client_payload.path }}"

  unpublish-from-streamx:
    if: (github.event.client_payload.status == 200 || github.event.client_payload.status == 204) && endsWith(github.event.client_payload.path, '.md')
    runs-on: ubuntu-latest
    steps:
      - name: Prepare ingestion variables
        id: vars
        shell: bash
        run: |
          sleep 1s
          streamx_path=$(echo "${{ github.event.client_payload.path }}" | sed 's/\.md$//g')
          # Indexed documents are namespaced (`en:/en/blog/post`), so the
          # unpublish subject has to carry the same prefix the publish workflow
          # builds - a bare path targets a document id that does not exist.
          if [[ "$streamx_path" =~ ^/([a-z]{2}(-[a-z]{2})?)(/|$) ]]; then
            streamx_namespace="${BASH_REMATCH[1]}:"
          else
            streamx_namespace=""
          fi
          streamx_subject=${streamx_namespace}${streamx_path}
          echo "streamx_subject=${streamx_subject}" >> "$GITHUB_OUTPUT"
          echo "CloudEvent subject: ${streamx_subject}"

      # Mirrors the publish job: same action org/@v1 input schema (event-type +
      # subject), and the same STREAMX_INGESTION_GH_TOKEN. The previous config
      # used the streamx-dev org with `action`/`channel`/`key` inputs that @v1
      # no longer defines, plus STREAMX_INGESTION_EDS_TOKEN, which fails auth -
      # so unpublished pages were never removed from the search index.
      - name: Run unpublish from StreamX
        id: unpublish
      # Internalized action. The upstream original
      # (streamx-hub/streamx-common-github-actions/.github/actions/connector-github@v1)
      # is refused outright in an org whose actions allow-list is limited to
      # enterprise-owned, GitHub-authored or Marketplace-verified actions. This
      # copy lives in a repo we own and references no third-party action, so it
      # runs under that policy. Inputs are unchanged — see that repo's
      # .github/actions/connector-github/README.md.
        uses: arbory-digital-inc/arbory-streamx/.github/actions/connector-github@v1
        env:
          STREAMX_CONNECTION_SOCKET_TIMEOUT: 30000
          STREAMX_CONNECTION_TIMEOUT: 3000
        with:
          streamx-ingestion-url: ${{ vars.STREAMX_INGESTION_URL }}
          streamx-ingestion-token: ${{ secrets.STREAMX_INGESTION_GH_TOKEN }}
          event-type: 'com.streamx.blueprints.page.unpublished.v1'
          subject: ${{ steps.vars.outputs.streamx_subject }}

      # The mirror of the publish check, and the more valuable of the two. An
      # unpublish whose subject does not match the one the publish built targets
      # a document that does not exist: the connector reports success, the job
      # goes green, and the page stays searchable forever. That has already
      # happened once in this repo's history — see the note above about the
      # namespace prefix. Nothing but an outside check catches it.
      #
      # No query here on purpose: a document missing from a query's results may
      # simply not match it, so only the content-independent existence check is
      # evidence of removal.
      - name: Confirm the page left the search index
        if: steps.unpublish.outcome == 'success'
        uses: arbory-digital-inc/arbory-streamx/.github/actions/verify-indexed@v1
        with:
          delivery-url: ${{ vars.STREAMX_DELIVERY_URL }}
          subject: ${{ steps.vars.outputs.streamx_subject }}
          expect: absent
          timeout-seconds: '300'
