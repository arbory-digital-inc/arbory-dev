name: Publish to StreamX

on:
  repository_dispatch:
    types:
      - resource-published

permissions:
  id-token: write
  contents: read

jobs:
  check-event-status:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo $CLIENT_PAYLOAD
          echo "Status: ${{ github.event.client_payload.status }}"
          echo "Path: ${{ github.event.client_payload.path }}"

  publish-to-streamx:
    if: (github.event.client_payload.status == 200 || github.event.client_payload.status == 204) && endsWith(github.event.client_payload.path, '.md')
    runs-on: ubuntu-latest
    steps:
      - name: Prepare ingestion variables
        id: vars
        shell: bash
        run: |
          sleep 1s
          streamx_path=$(echo "${{ github.event.client_payload.path }}" | sed 's/\.md$//g')
          if [[ "$streamx_path" =~ ^/([a-z]{2}(-[a-z]{2})?)(/|$) ]]; then
            streamx_namespace="${BASH_REMATCH[1]}:"
          else
            streamx_namespace=""
          fi
          page_path=$(echo "${{ github.event.client_payload.path }}" | sed 's/\.md$//g' | sed 's/index//g')
          eds_page_url="${{ vars.EDS_DOMAIN_URL }}$page_path"
          streamx_subject=${streamx_namespace}${streamx_path}
          echo "streamx_subject=${streamx_subject}" >> "$GITHUB_OUTPUT"
          echo "eds_page_url=$eds_page_url" >> "$GITHUB_OUTPUT"
          echo "Page URL: $eds_page_url"
          echo "CloudEvent subject: ${streamx_subject}"


      # Read the document's freshness stamp BEFORE publishing, so the check
      # afterwards can require it to have changed. Without a baseline the check
      # can only ask "is this page in the index", which any previously-published
      # page satisfies instantly — it would go green even while StreamX is
      # accepting events and applying none of them.
      #
      # This never fails the job: no baseline just means the check downgrades to
      # existence and says so.
      - name: Read the current index state
        id: baseline
        continue-on-error: true
        uses: arbory-digital-inc/arbory-streamx/.github/actions/verify-indexed@v1
        with:
          delivery-url: ${{ vars.STREAMX_DELIVERY_URL }}
          subject: ${{ steps.vars.outputs.streamx_subject }}
          mode: read

      - name: Run publish to StreamX
        id: publish
        if: ${{ !(endsWith(steps.vars.outputs.streamx_subject, '/nav') ||
          endsWith(steps.vars.outputs.streamx_subject, '/footer')) }}
      # Internalized action. The upstream original
      # (streamx-hub/streamx-common-github-actions/.github/actions/connector-github@v1)
      # is refused outright in an org whose actions allow-list is limited to
      # enterprise-owned, GitHub-authored or Marketplace-verified actions. This
      # copy lives in a repo we own and references no third-party action, so it
      # runs under that policy. Inputs are unchanged — see that repo's
      # .github/actions/connector-github/README.md.
        uses: arbory-digital-inc/arbory-streamx/.github/actions/connector-github@v1
        env:
          STREAMX_CONNECTION_SOCKET_TIMEOUT: 30000
          STREAMX_CONNECTION_TIMEOUT: 3000
        with:
          source-provider: ExternalSourceProvider
          streamx-ingestion-url: ${{ vars.STREAMX_INGESTION_URL }}
          streamx-ingestion-token: ${{ secrets.STREAMX_INGESTION_GH_TOKEN }}
          event-type: 'com.streamx.blueprints.page.published.v1'
          event-data: '{"type": "page/eds"}'
          external-resource-url: ${{ steps.vars.outputs.eds_page_url }}
          subject: ${{ steps.vars.outputs.streamx_subject }}

      # The step above reports success when the ingestion API ACCEPTS the event.
      # Indexing and edge replication happen afterwards, asynchronously, and
      # nothing in this workflow would notice if they stopped — a broken pipeline
      # and a working one produce the same green run. So the result is checked
      # from outside, against the endpoint a reader's browser actually queries.
      #
      # Passing the pre-publish stamp turns this from "is the page in the index"
      # into "was the page re-indexed by THIS publish" — the difference between a
      # check that passes whatever happens and one that catches StreamX accepting
      # events without applying them.
      #
      # The stamp is only visible once the search template projects
      # payload.ingested (V1.0.0.7.6 in arbory-streamx, which needs a mesh
      # deploy). Until then the action warns and falls back to an existence
      # check, which is weaker but still catches a page that never indexed at all.
      - name: Confirm the page reached the search index
        if: steps.publish.outcome == 'success'
        uses: arbory-digital-inc/arbory-streamx/.github/actions/verify-indexed@v1
        with:
          delivery-url: ${{ vars.STREAMX_DELIVERY_URL }}
          subject: ${{ steps.vars.outputs.streamx_subject }}
          previous-ingested: ${{ steps.baseline.outputs.ingested }}
          timeout-seconds: '300'
